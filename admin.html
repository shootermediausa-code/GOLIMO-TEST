  --bg: #f3f4f8; --card: #ffffff; --ink: #141a2a; --muted: #6b7489; --line: #e4e7ef; --soft: #f7f8fb;
  --side: #0b0f1a; --side-2: #141a2a; --side-ink: #c9cfdd;
  --gold: #c9a245; --gold-2: #d9b45a; --gold-soft: #fbf4e2;
  --green: #1f9d6b; --green-soft: #e4f6ee; --red: #d64555; --red-soft: #fde9eb; --amber: #c27a0e; --amber-soft: #fff3dc;
  --blue: #2f6fdb; --blue-soft: #e7effd; --gray-soft: #eef0f5;
  --r: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 22px; } h2 { font-size: 16px; } h3 { font-size: 14px; }

.shell { display: grid; grid-template-columns: 232px 1fr; height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; padding: 18px 12px; gap: 2px; overflow-y: auto; }
.brand { font-weight: 900; letter-spacing: 2px; color: #fff; font-size: 20px; padding: 4px 10px 18px; }
.brand b { color: var(--gold-2); }
.brand small { display: block; letter-spacing: 1px; font-size: 10px; color: #7d869c; font-weight: 700; margin-top: 2px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; color: var(--side-ink); text-decoration: none; font-weight: 500; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--side-2); color: #fff; }
.nav.on { background: rgba(217, 180, 90, .14); color: var(--gold-2); font-weight: 700; }
.nav .ic { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.side .foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid #1d2438; font-size: 12px; color: #7d869c; }
.main { overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 16px 28px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 500; }
.top .grow { flex: 1; }
.page { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.demo-banner { background: var(--gold-soft); color: #6b5212; border-bottom: 1px solid #efdfb4; padding: 7px 28px; font-size: 12.5px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h .grow { flex: 1; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
.right { text-align: right; } .nowrap { white-space: nowrap; }
.grow { flex: 1; }

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 12.5px; }
.stat .d { font-size: 12px; font-weight: 600; }
.up { color: var(--green); } .down { color: var(--red); }
.kpi { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; }
.kpi .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.gold { background: var(--side); color: var(--gold-2); border-color: var(--side); }
.btn.gold:hover { background: #1b2236; }
.btn.green { background: var(--green); color: #fff; border-color: var(--green); }
.btn.red { background: var(--card); color: var(--red); border-color: #f2c4ca; }
.btn.red:hover { background: var(--red-soft); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--blue); cursor: pointer; padding: 0; font-weight: 600; }

.input, select.input, textarea.input { height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 0 11px; background: var(--card); min-width: 0; width: 100%; }
textarea.input { height: auto; padding: 8px 11px; }
.input:focus { outline: 2px solid rgba(201, 162, 69, .35); border-color: var(--gold); }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--side); color: var(--gold-2); }

table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--soft); white-space: nowrap; position: sticky; top: 0; }
.t td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: #fafbfd; }
.t td.num, .t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tw { overflow-x: auto; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--gray-soft); color: #4a5368; }
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.amber { background: var(--amber-soft); color: var(--amber); }
.badge.blue { background: var(--blue-soft); color: var(--blue); }
.badge.gold { background: var(--gold-soft); color: #8a6a1c; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--gray-soft); flex: none; display: grid; place-items: center; font-weight: 700; color: var(--muted); font-size: 13px; }
.avatar.lg { width: 72px; height: 72px; font-size: 22px; }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.person .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
.alert.red { background: var(--red-soft); border-color: #f6cfd4; }
.alert.amber { background: var(--amber-soft); border-color: #f3dfb5; }
.alert.blue { background: var(--blue-soft); border-color: #cfdcf7; }
.err { color: var(--red); font-weight: 600; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

.modal-bg { position: fixed; inset: 0; background: rgba(11, 15, 26, .45); display: grid; place-items: center; z-index: 2000; padding: 16px; }
.modal { background: var(--card); border-radius: 16px; width: min(760px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
.modal .mh { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
.modal .mb { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--card); }
.x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); margin-left: auto; line-height: 1; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-color: var(--gold); }

.docgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.doc { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--card); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 92px; height: 62px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); cursor: zoom-in; background: var(--soft); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }

.map { height: 100%; min-height: 360px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #e9e5dc; position: relative; }
.map.noTiles .leaflet-tile-pane { display: none; }
.map-note { position: absolute; left: 10px; bottom: 10px; z-index: 600; background: rgba(255, 255, 255, .92); border-radius: 8px; padding: 4px 8px; font-size: 11.5px; color: var(--muted); }
.legend { position: absolute; right: 10px; top: 10px; z-index: 600; background: rgba(255, 255, 255, .95); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; }
.car-pin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
.pick-pin { width: 14px; height: 14px; border-radius: 3px; border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); background: var(--side); }

.dispatch { display: grid; grid-template-columns: 380px 1fr; gap: 16px; height: calc(100vh - 150px); min-height: 560px; }
.queue { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 2px; }
.job { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--card); cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.job:hover { border-color: #cfd5e3; }
.job.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 162, 69, .18); }
.addr { display: grid; grid-template-columns: 12px 1fr; gap: 2px 8px; align-items: center; font-size: 13px; }
.addr .p { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
.addr .d { width: 9px; height: 9px; border-radius: 2px; background: var(--ink); }
.addr span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 11px; color: var(--muted); }
.bars .b i { display: block; width: 100%; background: #cfd6e6; border-radius: 5px 5px 0 0; }
.bars .b.on i { background: var(--gold); }

.login { min-height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, #1d2438, #0b0f1a 60%); padding: 16px; }
.login .box { width: min(420px, 100%); background: var(--card); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px rgba(0, 0, 0, .35); }

.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dispatch { grid-template-columns: 1fr; height: auto; } .dispatch .map { height: 420px; } }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; }
  .side .brand, .side .foot { display: none; }
  .nav { width: auto; white-space: nowrap; }
  .page { padding: 16px; } .top { padding: 12px 16px; } .demo-banner { padding: 7px 16px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
}
